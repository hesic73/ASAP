# @package _global_

robot:
  num_bodies: 24
  dof_obs_size: 23
  
  # Joint and body names
  floating_base_joint: "floating_base_joint"
  base_link_name: "pelvis"
  
  dof_names:
    [
      "left_hip_pitch_joint",
      "left_hip_roll_joint",
      "left_hip_yaw_joint",
      "left_knee_joint",
      "left_ankle_pitch_joint",
      "left_ankle_roll_joint",
      "right_hip_pitch_joint",
      "right_hip_roll_joint",
      "right_hip_yaw_joint",
      "right_knee_joint",
      "right_ankle_pitch_joint",
      "right_ankle_roll_joint",
      "waist_yaw_joint",
      "waist_roll_joint",
      "waist_pitch_joint",
      "left_shoulder_pitch_joint",
      "left_shoulder_roll_joint",
      "left_shoulder_yaw_joint",
      "left_elbow_joint",
      "right_shoulder_pitch_joint",
      "right_shoulder_roll_joint",
      "right_shoulder_yaw_joint",
      "right_elbow_joint",
    ]

  body_names:
    [
      "pelvis",
      "left_hip_pitch_link",
      "left_hip_roll_link",
      "left_hip_yaw_link",
      "left_knee_link",
      "left_ankle_pitch_link",
      "left_ankle_roll_link",
      "right_hip_pitch_link",
      "right_hip_roll_link",
      "right_hip_yaw_link",
      "right_knee_link",
      "right_ankle_pitch_link",
      "right_ankle_roll_link",
      "waist_yaw_link",
      "waist_roll_link",
      "torso_link",
      "left_shoulder_pitch_link",
      "left_shoulder_roll_link",
      "left_shoulder_yaw_link",
      "left_elbow_link",
      "right_shoulder_pitch_link",
      "right_shoulder_roll_link",
      "right_shoulder_yaw_link",
      "right_elbow_link",
    ]

  init_state:
    pos: [0.0, 0.0, 0.8] # x,y,z [m]
    rot: [0.0, 0.0, 0.0, 1.0] # x,y,z,w [quat]
    lin_vel: [0.0, 0.0, 0.0] # x,y,z [m/s]
    ang_vel: [0.0, 0.0, 0.0] # x,y,z [rad/s]
    default_joint_angles: # = target angles [rad] when action = 0.0
      left_hip_pitch_joint: -0.1
      left_hip_roll_joint: 0.
      left_hip_yaw_joint: 0.
      left_knee_joint: 0.3
      left_ankle_pitch_joint: -0.2
      left_ankle_roll_joint: 0.
      right_hip_pitch_joint: -0.1
      right_hip_roll_joint: 0.
      right_hip_yaw_joint: 0.
      right_knee_joint: 0.3
      right_ankle_pitch_joint: -0.2
      right_ankle_roll_joint: 0.
      waist_yaw_joint: 0.
      waist_roll_joint: 0.
      waist_pitch_joint: 0.
      left_shoulder_pitch_joint: 0.
      left_shoulder_roll_joint: 0.
      left_shoulder_yaw_joint: 0.
      left_elbow_joint: 0.
      right_shoulder_pitch_joint: 0.
      right_shoulder_roll_joint: 0.
      right_shoulder_yaw_joint: 0.
      right_elbow_joint: 0.

  control:
    control_type: P
    # PD Drive parameters:
    stiffness: # [N*m/rad]
      hip_yaw: 100
      hip_roll: 100
      hip_pitch: 100
      knee: 200
      ankle_pitch: 20
      ankle_roll: 20
      waist_yaw: 400
      waist_roll: 400
      waist_pitch: 400
      shoulder_pitch: 90
      shoulder_roll: 60
      shoulder_yaw: 20
      elbow: 60

    damping: # [N*m/rad]  # [N*m*s/rad]
      hip_yaw: 2.5
      hip_roll: 2.5
      hip_pitch: 2.5
      knee: 5.0
      ankle_pitch: 0.2
      ankle_roll: 0.1
      waist_yaw: 5.0
      waist_roll: 5.0
      waist_pitch: 5.0
      shoulder_pitch: 2.0
      shoulder_roll: 1.0
      shoulder_yaw: 0.4
      elbow: 1.0

    # action scale: target angle = actionScale * action + defaultAngle
    action_scale: 0.25
    action_clip_value: 100.0
    clip_torques: True

    torque_limits:
      hip_yaw: 88.0
      hip_roll: 88.0
      hip_pitch: 88.0
      knee: 139.0
      ankle_pitch: 50.0
      ankle_roll: 50.0
      waist_yaw: 88.0
      waist_roll: 50.0
      waist_pitch: 50.0
      shoulder_pitch: 25.0
      shoulder_roll: 25.0
      shoulder_yaw: 25.0
      elbow: 25.0

  asset:
    xml_path: "g1/g1_29dof_anneal_23dof.xml"
