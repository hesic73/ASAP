# @package _global_

# Be careful when using _raw, history
obs:
  obs_dict:
    actor_obs: [
      base_ang_vel,
      projected_gravity,
      dof_pos,
      dof_vel,
      actions,
      ref_motion_phase_sin_cos,
      # dif_local_rigid_body_pos,
      # local_ref_rigid_body_pos,
      # history,
      history_actor
    ]

    critic_obs: [
      base_lin_vel,
      base_ang_vel,
      projected_gravity,
      dof_pos,
      dof_vel,
      actions,
      ref_motion_phase_sin_cos,
      dif_local_rigid_body_pos,
      local_ref_rigid_body_pos,
      history_critic,
      com_bias,
      base_mass_bias,
      kp_scale,
      kd_scale,
      ground_friction_values,
    ]

  obs_auxiliary: # define those coumpounds in obs_dict, for example, you can define different long/short history with different length

    history_actor: {
      base_ang_vel: 4,
      projected_gravity: 4,
      dof_pos: 4,
      dof_vel: 4,
      actions: 4,
      ref_motion_phase_sin_cos: 4
    }

    history_critic: {
      base_lin_vel: 4,
      base_ang_vel: 4,
      projected_gravity: 4,
      dof_pos: 4,
      dof_vel: 4,
      actions: 4,
      ref_motion_phase_sin_cos: 4
    }

  obs_scales: {
    base_lin_vel: 2.0,
    base_ang_vel: 0.25,
    projected_gravity: 1.0,
    dof_pos: 1.0,
    dof_vel: 0.05,
    actions: 1.0,
    dif_local_rigid_body_pos: 1.0,
    local_ref_rigid_body_pos: 1.0,
    ref_motion_phase_sin_cos: 1.0,
    history_actor: 1.0,
    history_critic: 1.0,
    com_bias: 10.0,
    base_mass_bias: 1.0,
    kp_scale: 1.0,
    kd_scale: 1.0,
    ground_friction_values: 1.0,
  }

  noise_scales: {
    base_lin_vel: 0.0,
    base_ang_vel: 0.3,
    projected_gravity: 0.2,
    dof_pos: 0.01,
    dof_vel: 1.0,
    actions: 0.0,
    dif_local_rigid_body_pos: 0.0,
    local_ref_rigid_body_pos: 0.0,
    ref_motion_phase_sin_cos: 0.0,
    history_actor: 0.0,
    history_critic: 0.0,
    com_bias: 0.0,
    base_mass_bias: 0.0,
    kp_scale: 0.0,
    kd_scale: 0.0,
    ground_friction_values: 0.0,
  }

  add_noise_currculum: False
  noise_initial_value: 0.05
  noise_value_max: 1.0
  noise_value_min: 0.00001
  soft_dof_pos_curriculum_degree: 0.00001
  soft_dof_pos_curriculum_level_down_threshold: 40
  soft_dof_pos_curriculum_level_up_threshold: 42

  obs_dims:
    - base_lin_vel: 3
    - base_ang_vel: 3
    - projected_gravity: 3
    - dof_pos: ${robot.dof_obs_size}
    - dof_vel: ${robot.dof_obs_size}
    - actions: ${robot.dof_obs_size}
    - dif_local_rigid_body_pos: ${eval:'3 * ${robot.num_bodies} + 3 * ${robot.motion.nums_extend_bodies}'}
    - local_ref_rigid_body_pos: ${eval:'3 * ${robot.num_bodies} + 3 * ${robot.motion.nums_extend_bodies}'}
    - ref_motion_phase_sin_cos: 2
    - com_bias: 3
    - base_mass_bias: 1
    - kp_scale: ${robot.dof_obs_size}
    - kd_scale: ${robot.dof_obs_size}
    - ground_friction_values: ${robot.num_bodies}
