# First we define the global structures that will be used by all the configs.
defaults:
  # - base/fabric
  - _self_
  - base/hydra
  - base/structure
  - simulator: isaacgym
  - domain_rand: domain_rand_asap
  - robot: g1/g1_29dof_anneal_23dof
  - terrain: terrain_locomotion_plane 
  - obs: motion_tracking/deepmimic_a2c_nolinvel_LARGEnoise_history
  - rewards: motion_tracking/reward_motion_tracking_dm_2real
  - exp: motion_tracking

# These are global variables that all levels of the config can access.
## Experiment setup
seed: 0
codebase_version: 1.0  # this is recorded to enable auto-conversion of models between different versions of the codebase
headless: True
num_envs: 4096

### Checkpoint logic
auto_load_latest: False
checkpoint: null

project_name: ASAP
experiment_name: my_exp
run_name: my_run

base_dir: logs
timestamp: ${now:%Y%m%d_%H%M%S}
experiment_dir: ${base_dir}/${experiment_name}/${timestamp}-${run_name}
save_dir: ${experiment_dir}/.hydra

force_flat_terrain: False

use_wandb: True

wandb:
  wandb_dir: wandb
  wandb_entity: null

### Simulation
sim_type: isaacgym
env_spacing: 20
output_dir: ${experiment_dir}/output

eval_overrides:
  headless: False
  num_envs: 1
  auto_load_latest: False
  use_wandb: False
