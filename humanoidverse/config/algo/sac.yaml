# @package _global_

algo:
  _target_: humanoidverse.agents.sac.sac.SAC
  _recursive_: False
  config:
    # SAC specific parameters
    replay_buffer_size: 1e6
    batch_size: 4096
    learning_starts: ${eval:'2 * ${algo.config.batch_size} * ${algo.config.gradient_steps}'}
    target_update_frequency: 1
    tau: 0.005
    gamma: 0.95
    
    # Critic ensemble parameters
    num_critics: 10  # Number of critics in ensemble
    num_sample_critics: 2  # Number of critics to sample for min Q computation
    
    # Learning rates
    actor_learning_rate: 1e-5
    critic_learning_rate: 1e-5
    alpha_learning_rate: 1e-5

    # Action bound loss
    action_bound_loss_weight: 10.0
    
    # Entropy regularization
    autotune_alpha: false  # Set to true for automatic alpha tuning
    alpha: 0.0  # Fixed alpha value (used when autotune_alpha is false)
    target_entropy: "auto"  # Target entropy for autotuning (auto = -action_dim)
    
    # Training parameters
    samples_per_iter: 512
    policy_frequency: 1  # How often to update policy (delayed updates like TD3)
    gradient_steps: 24  # How many gradient updates after each env step
    replay_buffer_on_device: false  # If true, place replay buffer tensors on the same device as the model (e.g., GPU)

    save_interval: 1000

    init_noise_std: 0.8
    fixed_std: false
    tanh_loc: false
    up_scale: 5.0
    
    # Optimization safety
    actor_max_grad_norm: 1.0
    critic_max_grad_norm: 1.0  # Separate clipping for critic (more aggressive)
    
    # General training config
    num_learning_iterations: 100000
    
    eval_callbacks: null

    module_dict:
      actor: 
        input_dim: [actor_obs]
        output_dim: [robot_action_dim]
        layer_config:
          type: MLP
          hidden_dims: [512, 256, 128]
          activation: ELU
      critic: 
        input_dim: [critic_obs, robot_action_dim]
        output_dim: [1]
        layer_config:
          type: MLP
          hidden_dims: [768, 256, 128]
          activation: ELU
