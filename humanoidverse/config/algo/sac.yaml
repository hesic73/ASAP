# @package _global_

algo:
  _target_: humanoidverse.agents.sac.sac.SAC
  _recursive_: False
  config:
    # SAC specific parameters
    replay_buffer_size: 1e6
    batch_size: 4096
    learning_starts: ${eval:'2 * ${algo.config.batch_size} * ${algo.config.gradient_steps} *8'}
    target_update_frequency: 1
    tau: 0.005
    gamma: 0.99
    
    # Learning rates
    actor_learning_rate: 3e-5
    critic_learning_rate: 3e-5
    alpha_learning_rate: 3e-5
    
    # Entropy regularization
    autotune_alpha: false  # Set to true for automatic alpha tuning
    alpha: 0.2  # Fixed alpha value (used when autotune_alpha is false)
    target_entropy: "auto"  # Target entropy for autotuning (auto = -action_dim)
    
    # Training parameters
    samples_per_iter: 4096
    policy_frequency: 2  # How often to update policy (delayed updates like TD3)
    gradient_steps: 1  # How many gradient updates after each env step
    replay_buffer_on_device: false  # If true, place replay buffer tensors on the same device as the model (e.g., GPU)

    save_interval: 1000
    
    # Optimization safety
    actor_max_grad_norm: 1.0
    critic_max_grad_norm: 1.0  # Separate clipping for critic (more aggressive)
    
    # General training config
    num_learning_iterations: 100000
    
    eval_callbacks: null

    module_dict:
      actor: 
        input_dim: [actor_obs]
        output_dim: [robot_action_dim]
        layer_config:
          type: MLP
          hidden_dims: [512, 256, 128]
          activation: ELU
      critic: 
        input_dim: [critic_obs, robot_action_dim]
        output_dim: [1]
        layer_config:
          type: MLP
          hidden_dims: [768, 256, 128]
          activation: ELU
